name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The app intentionally sets typescript.ignoreBuildErrors/eslint.ignoreDuringBuilds
      # in next.config.mjs, so a full `type-check` gate fails on ~60 pre-existing errors
      # unrelated to normal changes. The build gate below matches how the app deploys
      # and still catches import/config/structural breakage.
      - name: Build
        run: pnpm build
